# yaml-language-server: $schema=./vip-manifest.schema.json
#
# Handoff manifest for the Live Previews.
#
# This is the single file WordPress VIP reads to register and load your
# integration — VIP never sees your repo. `composer setup` (or `vip-integration
# init`) rewrites the example names below to yours. Fill in the rest, then check
# it with `npx @automattic/vip-integration validate`.
#
# See docs/manifest.md for a field-by-field guide, and vip-manifest.schema.json
# for the full schema (fields, types, and constraints).

manifest_version: 1
manifest_kind: vip-integration-handoff

integration:
  slug: live-previews
  display_name: Live Previews
  summary: Reference integration built from the VIP Integrations Starter Kit.
  partner:
    name: Automattic
    support_contact: support@example.com

documentation:
  public_url: https://example.com/docs/live-previews
  support_url: https://example.com/docs/live-previews/support

runtime:
  wordpress_plugin:
    folder: live-previews
    entry_file: live-previews.php
    php_namespace: 'Automattic\LivePreviews'
    scope: site

runtime_config:
  constant_name: VIP_LIVE_PREVIEWS_CONFIG
  fields:
    - key: api_base_url
      label: API base URL
      type: url
      required: true
      help: Base URL for the vendor API.
    - key: api_token
      label: API token
      type: secret
      required: true
      help: Token used to authenticate vendor API requests. Stored encrypted.
    - key: signature_label
      label: Signature label
      type: string
      required: false
      help: Text rendered in the site footer signature.

telemetry:
  prefix: live_previews_
  default_properties:
    - plugin_version
  events:
    - name: live_previews_sum_requested
      type: tracks
      trigger: The REST /sum endpoint serves a request.
      properties:
        - route
      note: Usage metadata only — no request payload or config values.

release:
  plugin_version: 1.0.0
  version_strategy: latest
  migration_required: false
  changelog: Initial VIP integration starter kit example.
